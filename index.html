 <!DOCTYPE html>
  <html lang="zh-CN">
  <head>
    <meta charset="UTF-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >

    <title>我的个人网站</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, "Microsoft YaHei", sans-serif;
        color: #ffffff;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .card {
        width: 100%;
        max-width: 700px;
        padding: 50px 30px;
        text-align: center;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(10px);
      }

      .avatar {
        width: 120px;
        height: 120px;
        margin-bottom: 20px;
        border: 4px solid #ffffff;
        border-radius: 50%;
        object-fit: cover;
      }

      h1 {
        margin: 10px 0;
        font-size: 42px;
      }

      h2 {
        margin-bottom: 20px;
        font-weight: normal;
        color: #f0eaff;
      }

      p {
        max-width: 550px;
        margin: 0 auto 30px;
        font-size: 18px;
        line-height: 1.8;
      }

      .button {
        display: inline-block;
        margin: 8px;
        padding: 12px 24px;
        color: #6847a8;
        font-weight: bold;
        text-decoration: none;
        background: #ffffff;
        border-radius: 999px;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .button:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      }

      footer {
        margin-top: 35px;
        font-size: 14px;
        color: #e4daf7;
      }

      @media (max-width: 600px) {
        .card {
          padding: 35px 20px;
        }

        h1 {
          font-size: 32px;
        }

        p {
          font-size: 16px;
        }
      }
    </style>
  </head>

  <body>
    <main class="card">
      <img
        class="avatar"
        src="https://github.com/TyperMonkie.png"
        alt="我的头像"
      >

      <h1>Hello, I am TyperMonkie</h1>

      <h2>欢迎来到我的个人网站</h2>

      <p>
        我是一名正在学习网页开发的学生。
        这个网站使用 HTML 和 CSS 制作，
        并通过 GitHub Pages 免费发布。
      </p>

      <a
        class="button"
        href="https://github.com/TyperMonkie"
        target="_blank"
        rel="noopener noreferrer"
      >
        我的 GitHub
      </a>

      <a
        class="button"
        href="mailto:2062073427@qq.com"
      >
        联系我
      </a>

      <footer>
        © 2026 小王的个人网站
      </footer>
    </main>
  </body>
  </html>
